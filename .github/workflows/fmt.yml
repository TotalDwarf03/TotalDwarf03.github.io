name: Check formatting

on:
	push:
	pull_request:

permissions:
	contents: read

jobs:
	prettier:
		name: Prettier
		runs-on: ubuntu-latest

		steps:
			- name: Check out repository
				uses: actions/checkout@v4

			- name: Set up Node.js
				uses: actions/setup-node@v4
				with:
					node-version: 22

			- name: Check formatting
				run: npx --yes prettier@3.6.2 --check '**/*.{html,css,yml,yaml}'
